  "At least one record is still being generated."
  Generating
  "All records generated; not all have been reviewed yet."
  InReview
  "All records have been reviewed and are ready to send."
  Reviewed
  "One or more reviewed records are being sent."
  Sending
  "All records have been sent."
  Completed
  "Processing has finished, but one or more records ended in an error state rather than being sent."
