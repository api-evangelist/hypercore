"A batch (flow) of statements generated for one entity type, tracking its records through the generate, review, and send lifecycle."
type StatementProcess {
  id: ID!
  "Doc template used to generate the statements in this process."
  templateId: ID!
  "The entity type all records in this process are generated for."
  entityType: StatementEntityType!
  "Aggregate status derived from the statuses of the contained records."
  status: StatementProcessStatus!
  "Editable display name for the statement flow."
  name: String!
  "Output format of the generated statement files (PDF or DOCX)."
  documentType: DocumentType!
  "Statement date applied to every record in the process."
  date: Date!
  "Optional - transactions list only includes transactions after this date."
  transactionsFromDate: Date
  "Optional - interest due rows are included from this date up to the statement date."
  interestRowsFromDate: Date
  "Optional - generate statements for a specific investor, with payments affected by commitment percentage."
  investorId: ID
  "The individual statement records that make up this process."
  records: [StatementProcessRecord!]!
  "When the statement process was created."
  createdAt: DateTime!
  "The user who created the statement process."
  createdBy: User!
}

"A single statement within a statement process, tracking its file, recipients, email content, status, and audit history."
type StatementProcessRecord {
  id: ID!
  "The primary entity this statement was generated for."
  entity: StatementProcessEntity!
  "For funding source statement generation, the related funding entity."
  secondaryEntity: StatementProcessEntity
  "Lifecycle status of this individual record."
  status: StatementProcessRecordStatus!
  "Output format of this record's generated file (PDF or DOCX)."
  documentType: DocumentType!
  "Statement date for this record."
  date: Date!
  "Name of the generated statement file."
  fileName: String!
  "Email addresses the statement will be sent to."
  recipients: [String!]
  "Subject line of the statement email."
  emailSubject: String
  "Optional note included in the body of the statement email."
  emailBody: String
  "The generated statement file."
  generatedFile: FileEntry
  "Audit trail of actions taken on this record (created, generated, reviewed, sent, etc.)."
  auditEntries: [AuditEntry!]
}

