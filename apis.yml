aid: hypercore
name: Hypercore
description: >-
  Hypercore is a loan management and servicing platform built for private credit
  lenders, venture debt funds, and commercial real estate financiers. It manages
  loans end to end — from pipeline and deal onboarding through origination,
  funding-source allocation, servicing, and maturity — with automation, portfolio
  business intelligence, and an AI admin agent for loan workflows. The platform
  exposes a production GraphQL API (single endpoint at api.hypercore.ai/graphql,
  Docusaurus-documented at docs.hypercore.ai) covering loans, equities, clients,
  funding sources, documents, statements, data tables, notifications, imports, and
  a maker/checker change-request approval workflow. Hypercore is a Y Combinator and
  Insight Partners backed company headquartered in Tel Aviv, Israel, and is SOC 2
  Type II certified.
